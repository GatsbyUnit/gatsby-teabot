<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Gatsby tea</title>
<link id="icon" rel="icon" href="data:,">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1f2328; --muted: #656d76; --line: #d8dee4;
    --accent: #1a73e8; --accent-text: #ffffff; --ok: #1a7f37; --err: #cf222e; --chip: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a1f; --card: #1f252c; --text: #e6edf3; --muted: #9aa5b1; --line: #313a44;
      --accent: #5b9cf5; --accent-text: #0d1117; --ok: #3fb950; --err: #f85149; --chip: #2a323b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 10px; font-size: 13px; }
  .when { font-weight: 600; }
  .title { margin-top: 4px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { background: var(--err); border-color: var(--err); color: #ffffff; }
  button.quiet { border: none; background: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 13px; }
  .warn { border-left: 3px solid var(--err); padding-left: 10px; }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 100%; }
  textarea { min-height: 90px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 3px; }
  .panel { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .msg { margin-top: 8px; font-size: 14px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hidden { display: none; }
  a { color: var(--accent); }
  footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
  .scroll { overflow-x: auto; }
  table.rotas { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.rotas th, table.rotas td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  table.rotas th:first-child, table.rotas td:first-child { text-align: left; }
  table.rotas th { font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>

<script>
  // A static page (GitHub Pages); everything on it comes from the tea bot's web app ("Gatsby Tea Page"), which
  // checks the personal code (t, swap, confirm) or, on the general page, the unit key (k) from the link.
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxjB4wiJ-jluRobucTdMruvxRofOwb1TXVIxgIe_vnPr06t2gg3hybxrV8Rmfp9Ufmx/exec';
  var QUERY = new URLSearchParams(location.search);
  function param(name, re){ var v = QUERY.get(name) || ''; return re.test(v) ? v : ''; }
  var TOKEN = param('t', /^[0-9a-f]{40}$/);
  var CONFIRM = param('confirm', /^[0-9a-f]{32}$/);
  var SWAP = param('swap', /^[0-9a-f]{32}$/);
  var LEAVE = QUERY.get('leave') ? '1' : '';
  var KEY = param('k', /^[\w-]{6,64}$/);
  var app = document.getElementById('app');

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k){
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c){ if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  // Calls go to the web app as an anonymous POST (doPost); credentials are left out, so being signed in to
  // Google (with one account or several) makes no difference.
  function call(fn, args, done, msgEl, button){
    if (button) button.disabled = true;
    if (msgEl){ msgEl.className = 'msg muted'; msgEl.textContent = 'Working…'; }
    var finish = function(res){ if (button) button.disabled = false; done(res); };
    var fail = function(text){
      if (button) button.disabled = false;
      text = String(text || 'Something went wrong.').replace(/^Exception: /, '').replace(/^Error: /, '');
      if (msgEl){ msgEl.className = 'msg err'; msgEl.textContent = text; }
      else { app.innerHTML = ''; app.appendChild(el('p', {class: 'msg err', text: text})); }
    };
    fetch(EXEC_URL, {method: 'POST', body: JSON.stringify({fn: fn, args: args}), credentials: 'omit', redirect: 'follow'})
      .then(function(r){ return r.json(); })
      .then(function(res){ if (res.ok) finish(res.result); else fail(res.error); })
      .catch(function(){ fail('Could not reach the tea bot. Please reload the page and check whether your change went through before trying again.'); });
  }
  function ok(msgEl, text){ msgEl.className = 'msg ok'; msgEl.textContent = text; }

  // ---- no link: ask for the email ----
  function renderLanding(){
    var msg = el('div', {class: 'msg'});
    var sel = el('select', {}, [el('option', {value: '', text: 'Loading names…'})]);
    var btn = el('button', {class: 'primary', text: 'Send me my link'});
    btn.disabled = true;
    btn.addEventListener('click', function(){
      if (!sel.value){ msg.className = 'msg err'; msg.textContent = 'Please pick your name.'; return; }
      call('api_request_link', [KEY, sel.value], function(res){ ok(msg, res); }, msg, btn);
    });
    call('api_link_people', [KEY], function(people){
      sel.innerHTML = '';
      sel.appendChild(el('option', {value: '', text: 'Pick your name…'}));
      people.forEach(function(p){ sel.appendChild(el('option', {value: p.id, text: p.name})); });
      msg.className = 'msg'; msg.textContent = '';
      btn.disabled = false;
    }, msg);
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Gatsby tea'}));
    app.appendChild(el('p', {class: 'muted', text: 'Swap your slot, add your talk title and set your away dates. Pick your name, and we will email your personal link to the address you are registered with.'}));
    app.appendChild(el('div', {class: 'card'}, [el('label', {text: 'Your name'}), sel, el('div', {class: 'row', style: 'margin-top:10px'}, [btn]), msg,
      el('p', {class: 'muted', style: 'margin:10px 0 0;font-size:13px', text: 'Not in the list, or registered with an old address? Ask the tea tsar.'})]));
  }

  // ---- email change confirmation ----
  function renderConfirm(){
    call('api_confirm_email', [CONFIRM], function(res){
      app.innerHTML = '';
      app.appendChild(el('h1', {text: 'Gatsby tea'}));
      app.appendChild(el('p', {class: 'msg ok', text: res}));
    });
  }

  // ---- answering a swap request (link from the email; accepting takes a click, as mail scanners open links) ----
  function renderSwapAnswer(){
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Gatsby tea'}));
    var msg = el('div', {class: 'msg'});
    app.appendChild(msg);
    call('api_swap_request', [SWAP], function(r){
      msg.className = 'msg'; msg.textContent = '';
      var yes = el('button', {class: 'primary', text: 'Accept: I take it over'});
      var no = el('button', {text: 'Decline'});
      var done = function(res){ yes.disabled = true; no.disabled = true; ok(msg, res); };
      yes.addEventListener('click', function(){ call('api_answer_swap', [SWAP, true], done, msg, yes); });
      no.addEventListener('click', function(){ call('api_answer_swap', [SWAP, false], done, msg, no); });
      app.insertBefore(el('div', {class: 'card'}, [
        el('p', {}, [el('strong', {text: r.from}), ' asks whether you can take over their ' + r.what + '.']),
        el('div', {class: 'when', text: r.when}),
        r.title ? el('div', {class: 'title', text: r.title}) : null,
        el('div', {class: 'row', style: 'margin-top:12px'}, [yes, no])
      ]), msg);
    }, msg);
  }

  function incomingCard(s){
    var card = el('div', {class: 'card'});
    s.incoming.forEach(function(r){
      var msg = el('div', {class: 'msg'});
      var yes = el('button', {class: 'primary', text: 'Accept'});
      var no = el('button', {text: 'Decline'});
      var done = function(res){ ok(msg, res); setTimeout(load, 2000); };
      yes.addEventListener('click', function(){ call('api_answer_swap_mine', [TOKEN, r.code, true], done, msg, yes); });
      no.addEventListener('click', function(){ call('api_answer_swap_mine', [TOKEN, r.code, false], done, msg, no); });
      card.appendChild(el('div', {style: 'margin-bottom:8px'}, [
        el('div', {}, [el('strong', {text: r.from}), ' asks you to take over their ' + r.what + ': ', el('span', {class: 'when', text: r.when})]),
        el('div', {class: 'row', style: 'margin-top:6px'}, [yes, no]), msg
      ]));
    });
    return card;
  }

  // ---- leaving the tea system (link at the end of every bot email); always takes a click here ----
  var LEAVE_TEXT = 'For people who are no longer members of the Unit. It is only about the Gatsby tea system: the rotas for research and tea talks, TNJC, MLJC, tea and coffee duty, and the tea bot\'s emails. Leaving does not take you off Gatsby\'s mailing lists.';
  var LEAVE_AFTER = 'Afterwards you will not be scheduled again and the bot will not email you any more; your Notion entry stays, marked inactive. To come back, just ask the tea tsar.';

  function renderLeave(){
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Leave the Gatsby tea system?'}));
    app.appendChild(el('p', {class: 'muted', text: '(No longer a member of the Unit)'}));
    var msg = el('div', {class: 'msg'});
    app.appendChild(msg);
    call('api_leave_info', [TOKEN], function(info){
      msg.className = 'msg'; msg.textContent = '';
      var go = el('button', {class: 'danger', text: 'Yes, take me out of the tea system'});
      var stay = el('a', {class: 'btn', href: location.pathname + '?t=' + TOKEN, text: 'No, back to my tea page'});
      var card = el('div', {class: 'card'}, [
        el('p', {}, ['You are ', el('strong', {text: info.name}), '.']),
        el('p', {text: LEAVE_TEXT}),
        el('p', {class: 'muted', text: LEAVE_AFTER})
      ]);
      if (info.slots.length){
        card.appendChild(el('div', {class: 'warn', style: 'margin:10px 0'}, [
          el('p', {style: 'margin:0 0 4px', text: 'You still have ' + (info.slots.length === 1 ? 'this slot' : 'these slots') + ':'}),
          el('ul', {style: 'margin:0 0 6px;padding-left:18px'}, info.slots.map(function(x){ return el('li', {text: x}); })),
          el('p', {style: 'margin:0', text: 'Leaving does not hand them over. Please swap them on your tea page first; otherwise the tea tsar has to find someone.'})
        ]));
      }
      card.appendChild(el('div', {class: 'row', style: 'margin-top:12px'}, [go, stay]));
      go.addEventListener('click', function(){
        call('api_leave', [TOKEN], function(res){ card.innerHTML = ''; card.appendChild(el('p', {class: 'msg ok', text: res})); }, msg, go);
      });
      app.insertBefore(card, msg);
    }, msg);
  }

  function renderLeaveLanding(){
    var msg = el('div', {class: 'msg'});
    var sel = el('select', {}, [el('option', {value: '', text: 'Loading names…'})]);
    var btn = el('button', {class: 'danger', text: 'Take me out of the tea system'});
    btn.disabled = true;
    btn.addEventListener('click', function(){
      if (!sel.value){ msg.className = 'msg err'; msg.textContent = 'Please pick your name.'; return; }
      call('api_leave_by_name', [KEY, sel.value], function(res){ btn.disabled = true; sel.disabled = true; ok(msg, res); }, msg, btn);
    });
    call('api_link_people', [KEY], function(people){
      sel.innerHTML = '';
      sel.appendChild(el('option', {value: '', text: 'Pick your name…'}));
      people.forEach(function(p){ sel.appendChild(el('option', {value: p.id, text: p.name})); });
      msg.className = 'msg'; msg.textContent = '';
      btn.disabled = false;
    }, msg);
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Leave the Gatsby tea system'}));
    app.appendChild(el('p', {class: 'muted', text: '(No longer a member of the Unit)'}));
    app.appendChild(el('div', {class: 'card'}, [
      el('p', {text: LEAVE_TEXT}),
      el('p', {class: 'muted', text: LEAVE_AFTER}),
      el('p', {text: 'Still have slots coming up? Please swap them on your tea page first; otherwise the tea tsar has to find someone.'}),
      el('label', {text: 'Your name'}), sel, el('div', {class: 'row', style: 'margin-top:10px'}, [btn]), msg
    ]));
  }

  // ---- organisers: who is on which rota ----
  function rotasCard(){
    var msg = el('div', {class: 'msg'});
    var show = el('button', {text: 'Show the table'});
    var box = el('div');
    var card = el('div', {class: 'card'}, [
      el('p', {class: 'muted', style: 'margin:0 0 8px', text: 'Everyone active on the rotas you organise. To change it, open their Notion page (click the name): the TNJC / CSNJC / MLJC / Coffee ticks, Position and the "Excluded from …" boxes.'}),
      el('div', {class: 'row'}, [show]), msg, box
    ]);
    show.addEventListener('click', function(){
      call('api_rotas', [TOKEN], function(r){
        show.classList.add('hidden');
        var filter = el('select', {style: 'width:auto'}, [el('option', {value: '', text: 'Everyone (' + r.people.length + ')'})].concat(r.columns.map(function(c){
          return el('option', {value: c.key, text: c.label + ' (' + r.people.filter(function(p){ return p.on[c.key]; }).length + ')'});
        })));
        var table = el('div', {class: 'scroll'});
        var draw = function(){
          var head = el('tr', {}, [el('th', {text: 'Name'})].concat(r.columns.map(function(c){ return el('th', {text: c.label}); })).concat([el('th', {text: 'Upcoming'}), el('th', {text: 'Email'})]));
          var rows = r.people.filter(function(p){ return !filter.value || p.on[filter.value]; }).map(function(p){
            return el('tr', {}, [el('td', {}, [el('a', {href: 'https://www.notion.so/' + p.id, target: '_blank', text: p.name, title: p.position || ''})])]
              .concat(r.columns.map(function(c){ return el('td', {text: p.on[c.key] ? '✓' : ''}); }))
              .concat([el('td', {text: p.upcoming ? String(p.upcoming) : '', title: p.next ? 'Next: ' + p.next : ''}), el('td', {text: p.email ? '' : 'missing', class: p.email ? '' : 'muted'})]));
          });
          table.innerHTML = '';
          table.appendChild(el('table', {class: 'rotas'}, [el('thead', {}, [head]), el('tbody', {}, rows)]));
        };
        filter.addEventListener('change', draw);
        draw();
        if (r.columns.length > 1) box.appendChild(el('div', {class: 'row', style: 'margin:8px 0'}, [filter]));
        box.appendChild(table);
        box.appendChild(el('p', {class: 'muted', style: 'margin:8px 0 0;font-size:13px', text: '"Upcoming" counts their slots from today (hover for the next one). "Email missing": no registered address, so no reminders; add it in column C of the identity sheet. ' + r.inactive + ' people are inactive and not shown.'}));
      }, msg, show);
    });
    return card;
  }

  // ---- personal page ----
  function load(){ call('api_state', [TOKEN], render); }

  function render(s){
    app.innerHTML = '';
    var hi = el('h1', {text: 'Hi ' + s.name.split(' ')[0]});
    if (s.badge){
      hi.style.cssText = 'display:flex;align-items:center;gap:10px';
      hi.insertBefore(el('img', {src: s.badge.src, alt: s.badge.label, title: s.badge.label, width: '48', height: '48'}), hi.firstChild);
    }
    app.appendChild(hi);
    if (s.badge) app.appendChild(el('p', {class: 'muted', style: 'margin:-2px 0 6px;font-size:13px', text: s.badge.label}));
    app.appendChild(el('p', {class: 'muted', text: 'Your Gatsby tea duties. Changes here update Notion and the shared calendar.'}));

    if (s.incoming && s.incoming.length){
      app.appendChild(el('h2', {text: 'Asked of you'}));
      app.appendChild(incomingCard(s));
    }

    app.appendChild(el('h2', {text: 'Your upcoming duties'}));
    if (!s.duties.length) app.appendChild(el('p', {class: 'muted', text: 'Nothing scheduled for you at the moment.'}));
    s.duties.forEach(function(d){ app.appendChild(dutyCard(d, s.people)); });

    app.appendChild(el('h2', {text: 'Away dates'}));
    app.appendChild(awayCard(s));


    if (s.organiser.length){
      app.appendChild(el('h2', {text: 'Organiser'}));
      s.organiser.forEach(function(o){ app.appendChild(organiserCard(o)); });
      app.appendChild(el('h2', {text: s.organiser.length > 1 ? 'Who is on which rota' : 'Who is on your rota'}));
      app.appendChild(rotasCard());
    }

    app.appendChild(el('h2', {text: 'Your email'}));
    app.appendChild(emailCard(s));

    app.appendChild(el('footer', {}, [
      'Rotas and rules: ', el('a', {href: s.notion_url, text: 'Gatsby Rotas on Notion'}), '. Keep this page\'s link to yourself: anyone with it can act as you here. ',
      el('button', {class: 'quiet', text: 'Leave the tea system (no longer a member of the Unit)…', onclick: renderLeave})
    ]));
  }

  function dutyCard(d, people){
    var msg = el('div', {class: 'msg'});
    var panel = el('div', {class: 'panel hidden'});
    var head = el('div', {class: 'row'}, [
      el('span', {class: 'when', text: d.when}),
      el('span', {class: 'chip', text: d.type}),
      el('span', {class: 'chip', text: d.duty_label}),
      d.tentative ? el('span', {class: 'chip', text: 'tentative'}) : null,
      d.cancelled ? el('span', {class: 'chip', text: 'talk cancelled'}) : null
    ]);
    var card = el('div', {class: 'card'}, [head]);
    if (d.duty === 'presenter') card.appendChild(el('div', {class: 'title' + (d.title ? '' : ' muted'), text: d.title || 'No title yet'}));
    var actions = el('div', {class: 'row', style: 'margin-top:10px'});
    if (d.tentative){
      card.appendChild(el('p', {class: 'muted', style: 'margin:8px 0 0', text: 'Tentative: you can swap or add a title once the organiser confirms it.'}));
    } else {
      if (d.pending){
        var withdraw = el('button', {text: 'Withdraw'});
        withdraw.addEventListener('click', function(){ call('api_withdraw_swap', [TOKEN, d.pending.code], function(res){ ok(msg, res); setTimeout(load, 1500); }, msg, withdraw); });
        card.appendChild(el('div', {class: 'row', style: 'margin-top:8px'}, [el('span', {class: 'muted', text: 'Waiting for ' + d.pending.to + ' to accept your swap request.'}), withdraw]));
      }
      if (d.live) actions.appendChild(el('button', {text: d.pending ? 'Ask someone else' : 'Swap', onclick: function(){ showSwap(panel, d, people, msg); }}));
      if (d.can_title) actions.appendChild(el('button', {text: d.title ? 'Edit title' : 'Add title', onclick: function(){ showTitle(panel, d, msg); }}));
      card.appendChild(actions);
      if (d.can_cancel) card.appendChild(el('div', {style: 'margin-top:8px'}, [el('button', {class: 'quiet', text: 'Nobody can take over?', onclick: function(){ showCancel(panel, d, people, msg); }})]));
    }
    card.appendChild(panel);
    card.appendChild(msg);
    return card;
  }

  function showSwap(panel, d, people, msg){
    panel.innerHTML = '';
    panel.classList.remove('hidden');
    // people who normally do this duty first, then everyone else (a visitor may still step in)
    var usual = d.usual || [];
    var option = function(p){ return el('option', {value: p.id, text: p.name}); };
    var first = people.filter(function(p){ return usual.indexOf(p.id) >= 0; });
    var rest = people.filter(function(p){ return usual.indexOf(p.id) < 0; });
    var sel = el('select', {}, [el('option', {value: '', text: 'Choose who takes it over…'})].concat(first.length && rest.length
      ? [el('optgroup', {label: 'On this rota'}, first.map(option)), el('optgroup', {label: 'Everyone else'}, rest.map(option))]
      : people.map(option)));
    var btn = el('button', {class: 'primary', text: 'Swap'});
    // turns are counted per rota: someone outside it can step in, but the slot then counts for nobody
    var note = el('p', {class: 'muted hidden', style: 'margin:6px 0 0;font-size:13px', text: 'Not on this rota: they can still take it, but it won\'t count as anyone\'s turn. You keep yours, so you\'ll be scheduled again soon.'});
    sel.addEventListener('change', function(){ note.classList.toggle('hidden', !(first.length && sel.value && usual.indexOf(sel.value) < 0)); });
    btn.addEventListener('click', function(){
      if (!sel.value){ msg.className = 'msg err'; msg.textContent = 'Please choose a person.'; return; }
      call('api_swap', [TOKEN, d.row_id, d.duty, sel.value], function(res){ ok(msg, res); setTimeout(load, 1500); }, msg, btn);
    });
    panel.appendChild(el('p', {class: 'muted', text: 'They get an email to accept. Nothing changes until they do; if they have not answered after a day, you get a reminder. A slot less than a day away is swapped straight away.'}));
    panel.appendChild(sel);
    panel.appendChild(note);
    panel.appendChild(el('div', {class: 'row', style: 'margin-top:8px'}, [btn, el('button', {text: 'Cancel', onclick: function(){ panel.classList.add('hidden'); }})]));
  }

  // Cancelling is a last resort: it sits behind "Swap", asks who was asked, and offers the swap again.
  function showCancel(panel, d, people, msg){
    panel.innerHTML = '';
    panel.classList.remove('hidden');
    panel.appendChild(el('p', {class: 'warn'}, [el('strong', {text: 'Please swap instead of cancelling.'}),
      ' A cancelled talk is a gap for everyone. Ask colleagues directly, then hand the slot over with Swap. Cancel only if really nobody can take over.']));
    panel.appendChild(el('p', {class: 'muted', text: 'If you cancel, the calendar shows the talk as cancelled, the organiser is told, and you stay in the queue, so you will be scheduled again soon. Tea duty stays as it is.'}));
    var reason = el('textarea', {placeholder: 'Who did you ask, and why can nobody take over?'});
    var check = el('input', {type: 'checkbox', style: 'width:auto;margin:0 8px 0 0'});
    var btn = el('button', {class: 'danger', text: 'Cancel my talk'});
    btn.disabled = true;
    var update = function(){ btn.disabled = !(check.checked && reason.value.trim().length >= 10); };
    check.addEventListener('change', update);
    reason.addEventListener('input', update);
    btn.addEventListener('click', function(){
      call('api_cancel', [TOKEN, d.row_id, reason.value], function(res){ ok(msg, res); panel.classList.add('hidden'); setTimeout(load, 2500); }, msg, btn);
    });
    panel.appendChild(el('label', {text: 'Who did you ask, and why can nobody take over?'}));
    panel.appendChild(reason);
    panel.appendChild(el('label', {style: 'display:flex;align-items:center;color:var(--text);font-size:14px;margin-top:10px'}, [check, 'I asked colleagues, and nobody can take over.']));
    panel.appendChild(el('div', {class: 'row', style: 'margin-top:10px'}, [
      el('button', {class: 'primary', text: 'Swap instead', onclick: function(){ showSwap(panel, d, people, msg); }}),
      btn,
      el('button', {text: 'Close', onclick: function(){ panel.classList.add('hidden'); }})
    ]));
  }

  function showTitle(panel, d, msg){
    panel.innerHTML = '';
    panel.classList.remove('hidden');
    var t = el('input', {type: 'text', value: d.title || '', placeholder: 'Talk title'});
    var desc = el('textarea', {placeholder: 'Description, paper link, …'});
    desc.value = d.description || '';
    var btn = el('button', {class: 'primary', text: 'Save'});
    btn.addEventListener('click', function(){
      call('api_title', [TOKEN, d.row_id, t.value, desc.value], function(res){ ok(msg, res); setTimeout(load, 1500); }, msg, btn);
    });
    panel.appendChild(el('label', {text: 'Title'}));
    panel.appendChild(t);
    panel.appendChild(el('label', {text: 'Description (for journal clubs, include the paper link)'}));
    panel.appendChild(desc);
    panel.appendChild(el('div', {class: 'row', style: 'margin-top:8px'}, [btn, el('button', {text: 'Cancel', onclick: function(){ panel.classList.add('hidden'); }})]));
  }

  function awayCard(s){
    var msg = el('div', {class: 'msg'});
    var card = el('div', {class: 'card'});
    if (!s.away.length) card.appendChild(el('p', {class: 'muted', text: 'No upcoming away dates.'}));
    s.away.forEach(function(a){
      var right = el('button', {text: 'Remove'});
      right.addEventListener('click', function(){ call('api_remove_away', [TOKEN, a.row], function(res){ ok(msg, res); setTimeout(load, 800); }, msg, right); });
      card.appendChild(el('div', {class: 'row', style: 'justify-content:space-between;margin-bottom:6px'}, [
        el('span', {}, [el('span', {class: 'when', text: a.label}), a.reason ? el('span', {class: 'muted', text: ' · ' + a.reason}) : null]), right
      ]));
    });
    if (!s.has_away_sheet){
      card.appendChild(el('p', {class: 'muted', text: 'You do not have an away-dates sheet yet. Please ask the tea tsar for one.'}));
      return card;
    }
    var from = el('input', {type: 'date'});
    var to = el('input', {type: 'date'});
    var reason = el('input', {type: 'text', placeholder: 'Optional, e.g. conference'});
    var add = el('button', {class: 'primary', text: 'Add away dates'});
    add.addEventListener('click', function(){ call('api_add_away', [TOKEN, from.value, to.value, reason.value], function(res){ ok(msg, res); setTimeout(load, 800); }, msg, add); });
    card.appendChild(el('div', {class: 'panel'}, [
      el('div', {class: 'grid2'}, [el('div', {}, [el('label', {text: 'From'}), from]), el('div', {}, [el('label', {text: 'To'}), to])]),
      el('label', {text: 'Reason'}), reason,
      el('div', {class: 'row', style: 'margin-top:8px'}, [add])
    ]));
    card.appendChild(msg);
    return card;
  }

  function organiserCard(o){
    var msg = el('div', {class: 'msg'});
    var talks = o.rota === 'talks';
    var from = el('input', {type: 'date', value: o.from});
    var to = el('input', {type: 'date', value: o.to});
    var tfrom = el('input', {type: 'date', value: o.tea_from});
    var tto = el('input', {type: 'date', value: o.tea_to});
    var showResult = function(res){
      msg.className = 'msg ok'; msg.innerHTML = '';
      var head = (res.created !== undefined ? 'Created ' + res.created + ' slot' + (res.created === 1 ? '' : 's') + (res.existing ? ' (' + res.existing + ' already existed)' : '') + '. ' : '') +
        'Filled ' + res.filled.length + '. Check them in Notion: delete any you do not need (closures, retreat, deadlines) and change anyone you like, then finalise.';
      msg.appendChild(el('div', {text: head}));
      if (res.holidays && res.holidays.length) msg.appendChild(el('div', {class: 'muted', text: 'Skipped bank holidays: ' + res.holidays.join(', ')}));
      var list = el('ul', {style: 'margin:6px 0 0;padding-left:18px'});
      res.filled.concat(res.unfilled).forEach(function(l){ list.appendChild(el('li', {text: l})); });
      msg.appendChild(list);
      res.warnings.forEach(function(w){ msg.appendChild(el('div', {class: 'muted', text: w})); });
    };
    var plan = el('button', {class: 'primary', text: 'Plan these dates'});
    plan.addEventListener('click', function(){
      var ranges = talks ? {research_from: from.value, research_to: to.value, tea_from: tfrom.value, tea_to: tto.value} : {from: from.value, to: to.value};
      call('api_plan_slots', [TOKEN, o.rota, ranges], function(res){ showResult(res); setTimeout(function(){ call('api_state', [TOKEN], function(){}); }, 0); }, msg, plan);
      msg.textContent = 'Creating the slots, reading everyone\'s away dates and filling them. This can take a minute or two…';
    });
    var fill = el('button', {text: 'Fill ' + o.empty + ' empty slot' + (o.empty === 1 ? '' : 's') + ' again'});
    if (!o.empty) fill.classList.add('hidden');
    fill.addEventListener('click', function(){
      call('api_fill_slots', [TOKEN, o.rota], showResult, msg, fill);
      msg.textContent = 'Reading everyone\'s away dates and filling the slots. This can take a minute or two…';
    });
    var box = el('input', {type: 'checkbox', style: 'width:auto'});
    var fin = el('button', {text: 'Finalise ' + o.tentative + ' tentative slot' + (o.tentative === 1 ? '' : 's')});
    if (!o.tentative) fin.disabled = true;
    fin.addEventListener('click', function(){
      call('api_finalise', [TOKEN, o.rota, box.checked], function(res){ ok(msg, res); setTimeout(load, 1500); }, msg, fin);
    });
    var dates = talks
      ? [el('div', {class: 'grid2'}, [el('div', {}, [el('label', {text: 'Research talks from'}), from]), el('div', {}, [el('label', {text: 'to'}), to])]),
         el('div', {class: 'grid2'}, [el('div', {}, [el('label', {text: 'Tea talks from'}), tfrom]), el('div', {}, [el('label', {text: 'to'}), tto])])]
      : [el('div', {class: 'grid2'}, [el('div', {}, [el('label', {text: 'From'}), from]), el('div', {}, [el('label', {text: 'To'}), to])])];
    return el('div', {class: 'card'}, [
      el('div', {class: 'when', text: o.label}),
      el('p', {class: 'muted', style: 'margin:4px 0 0', text: 'Plan creates the slots for these dates (bank holidays are skipped) and fills them fairly, respecting away dates. They stay tentative: check them in Notion, then finalise to put them on the calendar.'})
    ].concat(dates).concat([
      el('div', {class: 'row', style: 'margin-top:10px'}, [plan, fill]),
      el('label', {style: 'display:flex;gap:8px;align-items:center;color:inherit;font-size:14px;margin-top:12px'}, [box, 'When finalising, email the group that the schedule was updated']),
      el('div', {class: 'row', style: 'margin-top:8px'}, [fin]),
      msg
    ]));
  }

  function emailCard(s){
    var msg = el('div', {class: 'msg'});
    var input = el('input', {type: 'email', placeholder: 'new address'});
    var btn = el('button', {text: 'Change'});
    btn.addEventListener('click', function(){ call('api_change_email', [TOKEN, input.value], function(res){ ok(msg, res); }, msg, btn); });
    return el('div', {class: 'card'}, [
      el('p', {}, ['Reminders and swap emails go to ', el('strong', {text: s.email}), '.']),
      el('div', {class: 'row'}, [el('div', {style: 'flex:1;min-width:200px'}, [input]), btn]),
      msg
    ]);
  }

  // ---- no personal code and no unit key (the public address, e.g. from Notion): your link by email ----
  function renderNoKey(){
    var msg = el('div', {class: 'msg'});
    var input = el('input', {type: 'email', placeholder: 'the address your tea reminders come to', autocomplete: 'email'});
    var btn = el('button', {class: 'primary', text: 'Send me my link'});
    var send = function(){ call('api_request_link_by_email', [input.value], function(res){ ok(msg, res); }, msg, btn); };
    btn.addEventListener('click', send);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Gatsby tea'}));
    app.appendChild(el('p', {class: 'muted', text: 'Swap your slot, add your talk title and set your away dates on your personal tea page. Enter the email address the tea bot writes to you at (where your reminders arrive; not necessarily your UCL one), and we will send you its link.' +
      (LEAVE ? ' Leaving the tea system is at the bottom of that page.' : '')}));
    app.appendChild(el('div', {class: 'card'}, [el('label', {text: 'Your email'}), input, el('div', {class: 'row', style: 'margin-top:10px'}, [btn]), msg,
      el('p', {class: 'muted', style: 'margin:10px 0 0;font-size:13px', text: 'The link is also in every gatsby.tea calendar event and in the tea bot\'s emails.'})]));
  }

  // the tab icon is a setting (FAVICON_URL in the constants sheet); without it the tab has none
  fetch(EXEC_URL, {method: 'POST', body: JSON.stringify({fn: 'api_page_icon', args: []}), credentials: 'omit'})
    .then(function(r){ return r.json(); })
    .then(function(res){ if (res.ok && res.result) document.getElementById('icon').href = res.result; })
    .catch(function(){});

  if (SWAP) renderSwapAnswer();
  else if (CONFIRM) renderConfirm();
  else if (LEAVE && TOKEN) renderLeave();
  else if (LEAVE && KEY) renderLeaveLanding();
  else if (TOKEN) load();
  else if (KEY) renderLanding();
  else renderNoKey();
</script>
</body>
</html>
