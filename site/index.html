<style>
  /* The tea page in the Gatsby Rotas design (rotas/site.css); what follows is only for its own parts. */
  main#app { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
  #app h1 { margin: 0 0 .35rem; font: 700 clamp(1.6rem, 4vw, 2.1rem)/1.2 var(--font-head); letter-spacing: -.015em; }
  #app h2 { margin: 2rem 0 .6rem; font: 650 1.2rem/1.3 var(--font-head); letter-spacing: -.01em; }
  #app p { margin: 0 0 .6rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1.05rem; margin: 0 0 .6rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .chip { display: inline-flex; align-items: center; padding: .25rem .45rem; border-radius: 4px; background: var(--surface-2); color: var(--text-2); font: 500 .78rem/1 var(--font-ui); }
  .when { font-weight: 650; }
  .title { margin-top: .25rem; }
  #app button, #app .btn {
    display: inline-flex; align-items: center; padding: .5rem .85rem; cursor: pointer; text-decoration: none;
    font: 500 .9rem/1.2 var(--font-ui); color: var(--text); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  }
  #app button:hover, #app .btn:hover { border-color: var(--muted); }
  #app button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  #app button.danger { background: var(--t-leaving); border-color: var(--t-leaving); color: #fff; }
  #app button.quiet { border: 0; background: none; padding: 0; color: var(--muted); font-size: .85rem; text-decoration: underline; text-underline-offset: .18em; }
  #app button:disabled { opacity: .55; cursor: default; }
  #app input, #app select, #app textarea {
    width: 100%; padding: .5rem .7rem; font: inherit; font-size: .95rem; color: var(--text);
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  }
  #app :is(input, select, textarea):focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  #app input[type=checkbox] { width: auto; }
  #app textarea { min-height: 6rem; }
  #app label { display: block; margin: .6rem 0 .25rem; font: 500 .82rem/1.3 var(--font-ui); color: var(--muted); }
  .panel { margin-top: .7rem; padding-top: .7rem; border-top: 1px dashed var(--line); }
  .msg { margin-top: .5rem; font-size: .92rem; }
  .msg.ok { color: var(--accent); }
  .msg.err { color: var(--t-leaving); }
  .warn { border-left: 3px solid var(--t-leaving); padding-left: .7rem; }
  /* Cancel: always there, next to Swap, and loud, so nobody presses it lightly */
  :root { --alert: #c8102e; --alert-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --alert: #ff4d5e; --alert-ink: #1a0005; } }
  :root[data-theme="dark"] { --alert: #ff4d5e; --alert-ink: #1a0005; }
  #app button.alert, dialog button.alert { background: var(--alert); border: 2px solid var(--alert); color: var(--alert-ink); font-weight: 800; letter-spacing: .01em; }
  #app button.alert:hover, dialog button.alert:hover { filter: brightness(1.1); border-color: var(--alert); }
  .duty-dialog { width: min(30rem, calc(100vw - 2rem)); padding: 1.2rem 1.3rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); }
  .duty-dialog::backdrop { background: rgb(0 0 0 / .4); }
  .duty-dialog.alerting { border: 3px solid var(--alert); box-shadow: 0 0 0 6px color-mix(in srgb, var(--alert) 25%, transparent), 0 24px 60px rgb(0 0 0 / .5); }
  /* cancelling: the room goes dark red behind the question (a little tongue in cheek) */
  .duty-dialog.alerting::backdrop {
    background: radial-gradient(ellipse at center, rgb(110 0 16 / .72), rgb(28 0 5 / .96));
    animation: alarm-in .5s ease-out, alarm-pulse 2.4s ease-in-out .5s infinite;
  }
  @keyframes alarm-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes alarm-pulse { 50% { opacity: .82; } }
  @media (prefers-reduced-motion: reduce) { .duty-dialog.alerting::backdrop { animation: none; } }
  .duty-dialog h2 { margin: 0 0 .6rem; font: 750 1.15rem/1.3 var(--font-head); }
  .duty-dialog.alerting h2 { color: var(--alert); }
  .duty-dialog p { margin: 0 0 .6rem; }
  .duty-dialog textarea { width: 100%; min-height: 5rem; padding: .5rem .7rem; font: inherit; font-size: .95rem; color: var(--text); background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); box-sizing: border-box; }
  .duty-dialog label { display: block; margin: .6rem 0 .25rem; font: 500 .82rem/1.3 var(--font-ui); color: var(--muted); }
  .duty-dialog .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
  .duty-dialog button { display: inline-flex; align-items: center; padding: .5rem .85rem; cursor: pointer; font: 500 .9rem/1.2 var(--font-ui); color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); }
  .duty-dialog button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .duty-dialog button:disabled { opacity: .55; cursor: default; }
  .duty-dialog .msg.err { color: var(--alert); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .hidden { display: none !important; }
  /* waiting for the bot: the page stays hidden behind the bar (as on the Rotas site); actions get a small bar */
  body.is-waiting #app { visibility: hidden; }
  .msg .bar { width: min(12rem, 60vw); height: 3px; margin-top: .35rem; border-radius: 2px; background: var(--line); overflow: hidden; }
  .msg .bar span { display: block; height: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .1s linear; }
  #app footer { margin-top: 2rem; font-size: .85rem; color: var(--muted); }
  .scroll { overflow-x: auto; }
  table.rotas { border-collapse: collapse; width: 100%; font-size: .85rem; }
  table.rotas th, table.rotas td { padding: .35rem .5rem; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  table.rotas th:first-child, table.rotas td:first-child { text-align: left; }
  table.rotas th { font-weight: 600; color: var(--muted); }
  /* the tea tsar's debug view of someone else's page (?as=): a red frame and banner, red cards, nothing changes */
  body.debug-view::before { content: ''; position: fixed; inset: 0; border: 6px solid #d93025; pointer-events: none; z-index: 50; }
  .debug-banner { position: sticky; top: 0; z-index: 40; padding: .6rem 1rem; background: #d93025; color: #fff; font: 500 .9rem/1.4 var(--font-ui); text-align: center; }
  .debug-banner a { color: #fff; font-weight: 650; }
  body.debug-view .card { border: 2px solid #d93025; }
</style>
</head>
<body>
<header class="site-head">
  <div class="site-head-inner">
    <a class="brand" href="rotas/">Gatsby Rotas</a>
    <nav class="nav" aria-label="Pages"><ul>
      <li><a href="rotas/">Rotas</a></li>
      <li><a href="rotas/?p=tea-system">Tea System</a></li>
      <li><a href="rotas/?p=tnjc">TNJC</a></li>
      <li><a href="rotas/?p=mljc">MLJC</a></li>
      <li><a href="rotas/?p=coffee">Coffee</a></li>
      <li class="nav-tea-item"><a class="nav-tea" href="./" aria-current="page"><span aria-hidden="true">🫖</span> My tea page</a></li>
    </ul></nav>
    <a class="account" id="account" hidden></a>
  </div>
</header>
<main id="app"></main>
<footer class="footer"><p id="footer-links"></p></footer>

<script src="telemetry.js?v=1" data-page="tea" data-version="tea-1"></script>
<script>
  // A static page (GitHub Pages); everything on it comes from the tea bot's web app ("Gatsby Tea Page"), which
  // checks the personal code (t, swap, undo, confirm) or, on the general page, the unit key (k) from the link.
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxjB4wiJ-jluRobucTdMruvxRofOwb1TXVIxgIe_vnPr06t2gg3hybxrV8Rmfp9Ufmx/exec';
  var QUERY = new URLSearchParams(location.search);
  function param(name, re){ var v = QUERY.get(name) || ''; return re.test(v) ? v : ''; }
  var TOKEN = param('t', /^[0-9a-f]{40}$/);
  var CONFIRM = param('confirm', /^[0-9a-f]{32}$/);
  var SWAP = param('swap', /^[0-9a-f]{32}$/);
  var UNDO = param('undo', /^[0-9a-f]{32}$/);
  var LEAVE = QUERY.get('leave') ? '1' : '';
  var KEY = param('k', /^[\w-]{6,64}$/);
  // the tea tsar's (and the bot account's) read-only debug view of someone's page: ?as=<person id>
  var AS = param('as', /^[0-9a-f]{32}$/);
  var DEBUG = false;
  // This browser remembers the last personal page opened in it (this site's local storage only), so the general
  // links in calendar events and group emails open that page directly. "Forget me" on the page clears it.
  var REMEMBER = 'gatsby-tea-page';
  function remembered(){ try { var t = localStorage.getItem(REMEMBER) || ''; return /^[0-9a-f]{40}$/.test(t) ? t : ''; } catch (e) { return ''; } }
  function remember(t){ try { localStorage.setItem(REMEMBER, t); } catch (e) {} }
  function forget(){ try { localStorage.removeItem(REMEMBER); } catch (e) {} }
  var FROM_MEMORY = false;
  var app = document.getElementById('app');
  // each kind of slot looks the same here as on the Rotas site: its colour (rotas/site.css) and emoji ("Tea": tea duty;
  // the same emoji in the bot's emails, tests/run.js checks)
  const TYPE_EMOJI = {"Research Talk": "🧪", "Tea Talk": "🎤", "External Seminar": "🎓", "Leaving Tea": "👋", "Just Tea": "🫖", "MLJC": "🤖", "TNJC": "🧠", "CSNJC": "🧠", "Coffee Cleaning": "☕", "Tea": "🍵"};
  var TYPE_CLS = {'Research Talk': 'research', 'Tea Talk': 'tea-talk', 'External Seminar': 'external', 'Leaving Tea': 'leaving', 'Just Tea': 'just-tea', 'MLJC': 'mljc', 'TNJC': 'tnjc', 'Coffee Cleaning': 'coffee'};
  // a duty as a badge: "🍵 Tea duty at the research talk" in the research talk's colour
  function dutyBadge(type, duty, label){
    var csnjc = / \(CSNJC\)$/.test(type), kind = type.replace(/ \(CSNJC\)$/, '');
    var emoji = kind === 'Coffee Cleaning' ? TYPE_EMOJI['Coffee Cleaning'] : duty === 'tea' && kind !== 'Just Tea' ? TYPE_EMOJI.Tea : TYPE_EMOJI[csnjc ? 'CSNJC' : kind];
    return el('span', {class: 'badge t-' + (csnjc ? 'csnjc' : TYPE_CLS[kind] || 'other')}, [emoji ? el('span', {class: 'emoji', 'aria-hidden': 'true', text: emoji}) : null, label]);
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function(k){
      if (k === 'class') e.className = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function(c){ if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  // A bar that fills over the time a call usually takes (median of its last five, kept in this browser): 90% at
  // the usual time, then ever slower. Loading a page hides it behind the bar, as on the Rotas site; an action
  // shows a small bar under its button.
  var TIMES = 'gatsby-tea-times';
  var LABELS = {api_state: 'Getting your tea page…', api_link_people: 'Getting the names…', api_swap_request: 'Getting the swap request…', api_swap_undo_info: 'Getting the swap…', api_takeable: 'Getting the slots…',
                api_leave_info: 'Getting your details…', api_confirm_email: 'Confirming your address…'};
  function usual(fn){
    try { var t = (JSON.parse(localStorage.getItem(TIMES) || '{}')[fn] || []).slice().sort(function(a, b){ return a - b; }); return t.length ? t[Math.floor(t.length / 2)] : 4000; }
    catch (e) { return 4000; }
  }
  function took(fn, ms){
    try { var all = JSON.parse(localStorage.getItem(TIMES) || '{}'); all[fn] = (all[fn] || []).concat([Math.round(ms)]).slice(-5); localStorage.setItem(TIMES, JSON.stringify(all)); } catch (e) {}
  }
  var waiting = null;
  function bar(fn, msgEl){
    var ms = usual(fn), t0 = Date.now(), box;
    if (msgEl){
      box = msgEl;
      box.className = 'msg muted';
      box.innerHTML = '';
      box.appendChild(document.createTextNode('Working…'));
      box.appendChild(el('div', {class: 'bar', 'aria-hidden': 'true'}, [el('span')]));
    } else {
      if (waiting){ waiting.count++; return function(){ if (!--waiting.count) waiting.stop(); }; }
      var n = Math.max(1, Math.round(ms / 1000));
      box = el('div', {class: 'waiting', role: 'status'}, [el('p', {text: LABELS[fn] || 'Asking the tea bot…'}), el('div', {class: 'bar', 'aria-hidden': 'true'}, [el('span')]),
                                                          el('p', {class: 'eta', text: 'Usually about ' + n + ' second' + (n === 1 ? '' : 's') + '.'})]);
      document.body.appendChild(box);
      document.body.classList.add('is-waiting');
    }
    var span = box.querySelector('.bar span'), eta = box.querySelector('.eta');
    var tick = function(){
      var t = Date.now() - t0;
      span.style.transform = 'scaleX(' + (t < ms ? 0.9 * t / ms : 0.99 - 0.09 * Math.exp((ms - t) / ms)) + ')';
      if (eta && t > 2 * ms + 1000) eta.textContent = 'Taking longer than usual…';
    };
    tick();
    var timer = setInterval(tick, 100);
    var stop = function(){
      clearInterval(timer);
      var b = box.querySelector('.bar'); if (b && msgEl) b.remove();
      if (!msgEl){ box.remove(); document.body.classList.remove('is-waiting'); waiting = null; }
    };
    if (!msgEl){ waiting = {count: 1, stop: stop}; return function(){ if (!--waiting.count) waiting.stop(); }; }
    return stop;
  }

  // Calls go to the web app as an anonymous POST (doPost); credentials are left out, so being signed in to
  // Google (with one account or several) makes no difference.
  function call(fn, args, done, msgEl, button, failed){
    if (DEBUG && fn !== 'api_debug_state'){
      var no = 'Debug view: read-only, nothing was changed.';
      if (msgEl){ msgEl.className = 'msg err'; msgEl.textContent = no; }
      return;
    }
    if (button) button.disabled = true;
    var t0 = Date.now(), stop = bar(fn, msgEl), stopped = false;
    var end = function(ok){ if (stopped) return; stopped = true; stop(); if (ok) took(fn, Date.now() - t0); };
    var finish = function(res){ end(true); if (button) button.disabled = false; done(res); };
    var fail = function(text){
      end(false);
      if (button) button.disabled = false;
      text = String(text || 'Something went wrong.').replace(/^Exception: /, '').replace(/^Error: /, '');
      if (failed && failed(text)) return;
      if (msgEl){ msgEl.className = 'msg err'; msgEl.textContent = text; }
      else { app.innerHTML = ''; app.appendChild(el('p', {class: 'msg err', text: text})); }
    };
    post(fn, args, 1)
      .then(function(res){ if (res.ok) finish(res.result); else fail(res.error); })
      .catch(function(){ fail('Could not reach the tea bot. Please reload the page and check whether your change went through before trying again.'); });
  }
  // Now and then Google never delivers the bot's answer to one call (the bot was done in seconds; asking again
  // works). Calls that only read are asked again after 15 seconds, twice; changes are never sent twice.
  var READS = ['api_state', 'api_debug_state', 'api_link_people', 'api_rotas', 'api_leave_info'];
  // Each attempt also goes to the anonymous diagnostics (telemetry.js): the call's name, time and outcome.
  function track(fn, t0, outcome, attempt, detail){
    if (window.GatsbyTelemetry) window.GatsbyTelemetry.call(fn, Date.now() - t0, outcome, attempt, detail);
  }
  function post(fn, args, attempt){
    var stop = READS.indexOf(fn) >= 0 && window.AbortController ? new AbortController() : null;
    var timer = stop && setTimeout(function(){ stop.abort(); }, 15000);
    var t0 = Date.now();
    return fetch(EXEC_URL, {method: 'POST', body: JSON.stringify({fn: fn, args: args}), credentials: 'omit', redirect: 'follow', signal: stop ? stop.signal : undefined})
      .then(function(r){ return r.json(); })
      .then(function(res){ clearTimeout(timer); track(fn, t0, res.ok ? 'ok' : 'error', attempt, res.error); return res; }, function(err){
        clearTimeout(timer);
        var aborted = stop && stop.signal.aborted;
        track(fn, t0, aborted ? (attempt < 3 ? 'timeout' : 'gave up') : 'network', attempt, err && err.message);
        if (aborted && attempt < 3) return post(fn, args, attempt + 1);
        throw err;
      });
  }
  function ok(msgEl, text){ msgEl.className = 'msg ok'; msgEl.textContent = text; }

  // ---- no personal link: pick your name (with or without the unit key), or else type your address ----
  function renderLanding(){
    var msg = el('div', {class: 'msg'});
    var sel = el('select', {}, [el('option', {value: '', text: 'Loading names…'})]);
    var btn = el('button', {class: 'primary', text: 'Send me my link'});
    btn.disabled = true;
    btn.addEventListener('click', function(){
      if (!sel.value){ msg.className = 'msg err'; msg.textContent = 'Please pick your name.'; return; }
      call('api_request_link', [KEY, sel.value], function(res){ ok(msg, res); }, msg, btn);
    });
    call('api_link_people', [KEY], function(people){
      sel.innerHTML = '';
      sel.appendChild(el('option', {value: '', text: 'Pick your name…'}));
      people.forEach(function(p){ sel.appendChild(el('option', {value: p.id, text: p.name})); });
      msg.className = 'msg'; msg.textContent = '';
      btn.disabled = false;
    }, msg, null, function(){ if (KEY) return false; renderNoKey(); return true; });  // an older bot wanted the key: by email then
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Gatsby tea'}));
    app.appendChild(el('p', {class: 'muted', text: 'Swap your slot, add your talk title and set your away dates. Pick your name, and we will email your personal link to the address you are registered with.'}));
    app.appendChild(el('div', {class: 'card'}, [el('label', {text: 'Your name'}), sel, el('div', {class: 'row', style: 'margin-top:10px'}, [btn]), msg,
      el('p', {class: 'muted', style: 'margin:10px 0 0;font-size:13px'}, ['Not in the list? ', el('button', {class: 'quiet', text: 'Get your link by email address', onclick: renderNoKey}), ', or ask the tea tsar.'])]));
  }

  // ---- email change confirmation ----
  function renderConfirm(){
    call('api_confirm_email', [CONFIRM], function(res){
      app.innerHTML = '';
      app.appendChild(el('h1', {text: 'Gatsby tea'}));
      app.appendChild(el('p', {class: 'msg ok', text: res}));
    });
  }

  // ---- answering a swap request (link from the email; accepting takes a click, as mail scanners open links) ----
  function renderSwapAnswer(){
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Gatsby tea'}));
    var msg = el('div', {class: 'msg'});
    app.appendChild(msg);
    call('api_swap_request', [SWAP], function(r){
      msg.className = 'msg'; msg.textContent = '';
      var yes = el('button', {class: 'primary', text: 'Accept: I take it over'});
      var no = el('button', {text: 'Decline'});
      var done = function(res){ yes.disabled = true; no.disabled = true; ok(msg, res); };
      yes.addEventListener('click', function(){ call('api_answer_swap', [SWAP, true], done, msg, yes); });
      no.addEventListener('click', function(){ call('api_answer_swap', [SWAP, false], done, msg, no); });
      app.insertBefore(el('div', {class: 'card'}, [
        el('p', {}, [el('strong', {text: r.from}), ' asks whether you can take over their ' + r.what + '.']),
        el('div', {class: 'when', text: r.when}),
        r.title ? el('div', {class: 'title', text: r.title}) : null,
        el('div', {class: 'row', style: 'margin-top:12px'}, [yes, no])
      ]), msg);
    }, msg);
  }

  // ---- undoing a swap (link in the "Swap done" email; undoing takes a click, as mail scanners open links) ----
  function renderUndo(){
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Undo a swap'}));
    var msg = el('div', {class: 'msg'});
    app.appendChild(msg);
    call('api_swap_undo_info', [UNDO], function(r){
      msg.className = 'msg'; msg.textContent = '';
      var yes = el('button', {class: 'primary', text: 'Undo: give it back to ' + r.from});
      yes.addEventListener('click', function(){ call('api_undo_swap', [UNDO], function(res){ yes.disabled = true; ok(msg, res); }, msg, yes); });
      app.insertBefore(el('div', {class: 'card'}, [
        el('p', {}, [el('strong', {text: r.from}), ' handed their ' + r.what + ' to ', el('strong', {text: r.to}), '.']),
        el('div', {class: 'when', text: r.when}),
        r.title ? el('div', {class: 'title', text: r.title}) : null,
        el('p', {class: 'muted', text: 'Undoing puts ' + r.from + ' back on the slot. You both get an email.'}),
        el('div', {class: 'row', style: 'margin-top:12px'}, [yes])
      ]), msg);
    }, msg);
  }

  function incomingCard(s){
    var card = el('div', {class: 'card'});
    s.incoming.forEach(function(r){
      var msg = el('div', {class: 'msg'});
      var yes = el('button', {class: 'primary', text: 'Accept'});
      var no = el('button', {text: 'Decline'});
      var done = function(res){ ok(msg, res); setTimeout(load, 2000); };
      yes.addEventListener('click', function(){ call('api_answer_swap_mine', [TOKEN, r.code, true], done, msg, yes); });
      no.addEventListener('click', function(){ call('api_answer_swap_mine', [TOKEN, r.code, false], done, msg, no); });
      card.appendChild(el('div', {style: 'margin-bottom:8px'}, [
        el('div', {}, [el('strong', {text: r.from}), ' asks you to take over their ' + r.what + ': ', el('span', {class: 'when', text: r.when})]),
        el('div', {class: 'row', style: 'margin-top:6px'}, [yes, no]), msg
      ]));
    });
    return card;
  }

  // ---- leaving the tea system (link at the end of every bot email); always takes a click here ----
  var LEAVE_TEXT = 'For people who are no longer members of the Unit. It is only about the Gatsby tea system: the rotas for research and tea talks, TNJC, MLJC, tea and coffee duty, and the tea bot\'s emails. Leaving does not take you off Gatsby\'s mailing lists.';
  var LEAVE_AFTER = 'Afterwards you will not be scheduled again and the bot will not email you any more; your entry on the rotas stays, marked inactive. To come back, just ask the tea tsar.';

  function renderLeave(){
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Leave the Gatsby tea system?'}));
    app.appendChild(el('p', {class: 'muted', text: '(No longer a member of the Unit)'}));
    var msg = el('div', {class: 'msg'});
    app.appendChild(msg);
    call('api_leave_info', [TOKEN], function(info){
      msg.className = 'msg'; msg.textContent = '';
      var go = el('button', {class: 'danger', text: 'Yes, take me out of the tea system'});
      var stay = el('a', {class: 'btn', href: location.pathname + '?t=' + TOKEN, text: 'No, back to my tea page'});
      var card = el('div', {class: 'card'}, [
        el('p', {}, ['You are ', el('strong', {text: info.name}), '.']),
        el('p', {text: LEAVE_TEXT}),
        el('p', {class: 'muted', text: LEAVE_AFTER})
      ]);
      if (info.slots.length){
        card.appendChild(el('div', {class: 'warn', style: 'margin:10px 0'}, [
          el('p', {style: 'margin:0 0 4px', text: 'You still have ' + (info.slots.length === 1 ? 'this slot' : 'these slots') + ':'}),
          el('ul', {style: 'margin:0 0 6px;padding-left:18px'}, info.slots.map(function(x){ return el('li', {text: x}); })),
          el('p', {style: 'margin:0', text: 'Leaving does not hand them over. Please swap them on your tea page first; otherwise the tea tsar has to find someone.'})
        ]));
      }
      card.appendChild(el('div', {class: 'row', style: 'margin-top:12px'}, [go, stay]));
      go.addEventListener('click', function(){
        call('api_leave', [TOKEN], function(res){ card.innerHTML = ''; card.appendChild(el('p', {class: 'msg ok', text: res})); }, msg, go);
      });
      app.insertBefore(card, msg);
    }, msg);
  }

  function renderLeaveLanding(){
    var msg = el('div', {class: 'msg'});
    var sel = el('select', {}, [el('option', {value: '', text: 'Loading names…'})]);
    var btn = el('button', {class: 'danger', text: 'Take me out of the tea system'});
    btn.disabled = true;
    btn.addEventListener('click', function(){
      if (!sel.value){ msg.className = 'msg err'; msg.textContent = 'Please pick your name.'; return; }
      call('api_leave_by_name', [KEY, sel.value], function(res){ btn.disabled = true; sel.disabled = true; ok(msg, res); }, msg, btn);
    });
    call('api_link_people', [KEY], function(people){
      sel.innerHTML = '';
      sel.appendChild(el('option', {value: '', text: 'Pick your name…'}));
      people.forEach(function(p){ sel.appendChild(el('option', {value: p.id, text: p.name})); });
      msg.className = 'msg'; msg.textContent = '';
      btn.disabled = false;
    }, msg);
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Leave the Gatsby tea system'}));
    app.appendChild(el('p', {class: 'muted', text: '(No longer a member of the Unit)'}));
    app.appendChild(el('div', {class: 'card'}, [
      el('p', {text: LEAVE_TEXT}),
      el('p', {class: 'muted', text: LEAVE_AFTER}),
      el('p', {text: 'Still have slots coming up? Please swap them on your tea page first; otherwise the tea tsar has to find someone.'}),
      el('label', {text: 'Your name'}), sel, el('div', {class: 'row', style: 'margin-top:10px'}, [btn]), msg
    ]));
  }

  // ---- organisers: who is on which rota ----
  function rotasCard(){
    var msg = el('div', {class: 'msg'});
    var show = el('button', {text: 'Show the table'});
    var box = el('div');
    var card = el('div', {class: 'card'}, [
      el('p', {class: 'muted', style: 'margin:0 0 8px', text: 'Everyone active on the rotas you organise. To change it, open their page on the Gatsby Rotas site (click the name): the TNJC / CSNJC / MLJC / Coffee ticks, Position and the "Excluded from …" boxes.'}),
      el('div', {class: 'row'}, [show]), msg, box
    ]);
    show.addEventListener('click', function(){
      call('api_rotas', [TOKEN], function(r){
        show.classList.add('hidden');
        var filter = el('select', {style: 'width:auto'}, [el('option', {value: '', text: 'Everyone (' + r.people.length + ')'})].concat(r.columns.map(function(c){
          return el('option', {value: c.key, text: c.label + ' (' + r.people.filter(function(p){ return p.on[c.key]; }).length + ')'});
        })));
        var table = el('div', {class: 'scroll'});
        var draw = function(){
          var head = el('tr', {}, [el('th', {text: 'Name'})].concat(r.columns.map(function(c){ return el('th', {text: c.label}); })).concat([el('th', {text: 'Upcoming'}), el('th', {text: 'Email'})]));
          var rows = r.people.filter(function(p){ return !filter.value || p.on[filter.value]; }).map(function(p){
            return el('tr', {}, [el('td', {}, [el('a', {href: 'rotas/?person=' + p.id, text: p.name, title: p.position || ''})])]
              .concat(r.columns.map(function(c){ return el('td', {text: p.on[c.key] ? '✓' : ''}); }))
              .concat([el('td', {text: p.upcoming ? String(p.upcoming) : '', title: p.next ? 'Next: ' + p.next : ''}), el('td', {text: p.email ? '' : 'missing', class: p.email ? '' : 'muted'})]));
          });
          table.innerHTML = '';
          table.appendChild(el('table', {class: 'rotas'}, [el('thead', {}, [head]), el('tbody', {}, rows)]));
        };
        filter.addEventListener('change', draw);
        draw();
        if (r.columns.length > 1) box.appendChild(el('div', {class: 'row', style: 'margin:8px 0'}, [filter]));
        box.appendChild(table);
        box.appendChild(el('p', {class: 'muted', style: 'margin:8px 0 0;font-size:13px', text: '"Upcoming" counts their slots from today (hover for the next one). "Email missing": no registered address, so no reminders; add it in column C of the identity sheet. ' + r.inactive + ' people are inactive and not shown.'}));
      }, msg, show);
    });
    return card;
  }

  // ---- personal page ----
  function load(){
    call('api_state', [TOKEN], function(s){ remember(TOKEN); render(s); }, null, null, function(text){
      if (!FROM_MEMORY || !/not valid any more/.test(text)) return false;
      forget(); FROM_MEMORY = false; TOKEN = ''; route();  // a remembered link that stopped working
      return true;
    });
  }
  function forgetMe(){ forget(); location.href = location.pathname + (KEY ? '?k=' + encodeURIComponent(KEY) : ''); }

  // top right: whose page this is; with the site's photo and a link to their page there when this browser has them
  function showAccount(name, badge){
    var a = document.getElementById('account');
    var site = null, photo = '';
    try {
      site = JSON.parse(localStorage.getItem('gatsby-rotas') || 'null');
      if (site && site.token === TOKEN && site.person){
        var ph = (JSON.parse(localStorage.getItem('gatsby-rotas-photos') || 'null') || {}).photos || {};
        photo = ph[site.person] && ph[site.person] !== 'none' ? ph[site.person] : '';
      } else site = null;
    } catch (e) { site = null; }
    a.innerHTML = '';
    var face = photo ? el('span', {class: 'avatar avatar-xs'}, [el('img', {src: photo, alt: ''})])
      : el('span', {class: 'avatar avatar-xs avatar-mono', text: name.split(' ').map(function(w){ return w.charAt(0); }).filter(Boolean).slice(0, 1).concat(name.split(' ').length > 1 ? [name.split(' ').pop().charAt(0)] : []).join('').toUpperCase()});
    // a tsar's badge on their portrait, top left (as on the Rotas site)
    a.appendChild(badge ? el('span', {class: 'account-face'}, [face, el('img', {class: 'account-royal', src: badge.src, alt: badge.label})]) : face);
    a.appendChild(el('span', {class: 'account-name', text: name}));
    a.title = 'Signed in as ' + name + (badge ? ' (' + badge.label + ')' : '');
    a.href = site ? 'rotas/?person=' + site.person : './';
    a.hidden = false;
  }

  // ---- debug view (tea tsar, bot account): someone else's page, read-only, private details hidden by the bot ----
  function siteToken(){
    try { var s = JSON.parse(localStorage.getItem('gatsby-rotas') || 'null'); return s && /^[0-9a-f]{40}$/.test(s.token || '') ? s.token : ''; }
    catch (e) { return ''; }
  }
  function renderDebug(){
    var mine = TOKEN || siteToken() || remembered();
    if (!mine){ app.innerHTML = ''; app.appendChild(el('p', {class: 'msg err', text: 'Sign in on the Gatsby Rotas site first, then open the debug view from the person\'s page there.'})); return; }
    document.title = 'Debug view · Tea page';
    call('api_debug_state', [mine, AS], function(s){
      DEBUG = true;
      document.body.classList.add('debug-view');
      document.body.insertBefore(el('div', {class: 'debug-banner', role: 'status'}, [
        'Debug view: ', el('strong', {text: s.name}), '\u2019s tea page as they see it, opened by ' + s.debug.viewer + '. Read-only; their away dates and email are hidden. ',
        el('a', {href: 'rotas/?person=' + AS, text: 'Leave the debug view'})
      ]), document.body.firstChild);
      render(s);
    });
  }

  function render(s){
    app.innerHTML = '';
    if (!DEBUG) showAccount(s.name, s.badge);
    if (s.tea_tsar && !DEBUG){ TSAR = s.tea_tsar; footerLinks(); }
    var hi = el('h1', {text: 'Hi ' + (s.badge ? s.badge.label + ' ' : '') + s.name.split(' ')[0]});
    if (s.badge){
      hi.style.cssText = 'display:flex;align-items:center;gap:10px';
      hi.insertBefore(el('img', {src: s.badge.src, alt: s.badge.label, title: s.badge.label, width: '48', height: '48'}), hi.firstChild);
    }
    app.appendChild(hi);
    if (FROM_MEMORY) app.appendChild(el('p', {class: 'muted', style: 'margin:-2px 0 6px;font-size:13px'}, [
      'Not ' + s.name.split(' ')[0] + '? ', el('button', {class: 'quiet', text: 'Log in as a different user', onclick: forgetMe})]));
    app.appendChild(el('p', {class: 'muted', text: 'Your Gatsby tea duties. Changes here update the Gatsby Rotas site and the shared calendar.'}));

    if (s.incoming && s.incoming.length){
      app.appendChild(el('h2', {text: 'Asked of you'}));
      app.appendChild(incomingCard(s));
    }

    app.appendChild(el('h2', {text: 'Your upcoming duties'}));
    if (!s.duties.length) app.appendChild(el('p', {class: 'muted', text: 'Nothing scheduled for you at the moment.'}));
    s.duties.forEach(function(d){ app.appendChild(dutyCard(d, s.people)); });

    app.appendChild(el('h2', {text: 'Take over a slot'}));
    app.appendChild(takeOverCard());

    app.appendChild(el('h2', {text: 'Away dates'}));
    app.appendChild(awayCard(s));


    if (s.organiser.length){
      app.appendChild(el('h2', {text: 'Organiser'}));
      s.organiser.forEach(function(o){ app.appendChild(organiserCard(o)); });
      app.appendChild(el('h2', {text: s.organiser.length > 1 ? 'Who is on which rota' : 'Who is on your rota'}));
      app.appendChild(rotasCard());
    }

    app.appendChild(el('h2', {text: 'Your email'}));
    app.appendChild(emailCard(s));

    if (DEBUG) return;
    app.appendChild(el('footer', {}, [
      'Rotas and rules: ', el('a', {href: s.notion_url, text: 'Gatsby Rotas'}), '. Keep this page\'s link to yourself: anyone with it can act as you here. ',
      'This browser remembers your page, so the tea links in calendar events and group emails open it directly. ',
      el('button', {class: 'quiet', text: 'Forget me on this browser', onclick: forgetMe}), ' ',
      el('button', {class: 'quiet', text: 'Leave the tea system (no longer a member of the Unit)…', onclick: renderLeave}), ' ',
      el('button', {class: 'quiet', text: 'Copy my code for an AI agent', title: 'For the tea bot\'s MCP server (github.com/GatsbyUnit/gatsby-teabot, mcp/): the agent can then do what you can do here', onclick: function(e){
        var b = e.currentTarget;
        navigator.clipboard.writeText(TOKEN).then(function(){ b.textContent = 'Copied: keep it to yourself'; }, function(){ b.textContent = TOKEN; });
      }})
    ]));
  }

  // The page footer: report an issue, the privacy notice, the code on GitHub. The tea tsar's name and address
  // come with the personal page (api_state); until then "Report an issue" offers GitHub only.
  var REPO_URL = 'https://github.com/GatsbyUnit/gatsby-teabot';
  var TSAR = null;
  function footerLinks(){
    var box = document.getElementById('footer-links');
    box.innerHTML = '';
    var sep = function(){ return el('span', {class: 'sep', 'aria-hidden': 'true', text: '·'}); };
    box.appendChild(el('button', {type: 'button', class: 'link-button', text: 'Report an issue' + (TSAR && TSAR.name ? ' (tea tsar ' + TSAR.name + ')' : ''), onclick: function(){ reportIssue(TSAR); }}));
    box.appendChild(sep());
    box.appendChild(el('a', {href: 'privacy.html', text: 'Privacy'}));
    box.appendChild(sep());
    box.appendChild(el('a', {href: REPO_URL, target: '_blank', rel: 'noopener', text: 'GitHub'}));
  }
  footerLinks();

  // "Report an issue": an email to the tea tsar, or an issue on GitHub (public). Never this page's address: it holds the code.
  function reportIssue(c){
    var ask = '(What happened, and what did you expect?)';
    var first = c && c.name ? c.name.split(' ')[0] : '';
    var mail = c && ('mailto:' + c.email + '?subject=' + encodeURIComponent('Gatsby tea page: a problem') +
      '&body=' + encodeURIComponent('Hi ' + (first || 'there') + ',\n\n' + ask + '\n\nPage: my tea page\n'));
    var issue = REPO_URL + '/issues/new?body=' + encodeURIComponent(ask + '\n\nPage: the tea page\n');
    var old = document.querySelector('.report-dialog');
    if (old) old.remove();
    var dlg = el('dialog', {class: 'report-dialog', 'aria-labelledby': 'report-title'}, [
      el('h2', {id: 'report-title', text: 'Report an issue'}),
      el('p', {text: 'Something wrong or confusing on the rotas, the tea page or in the tea bot\'s emails? ' + (c ? 'Tell the tea tsar' + (c.name ? ', ' + c.name + ',' : '') + ' by email, or open' : 'Open') + ' an issue on GitHub (public, needs a GitHub account)' + (c ? '.' : ', or tell the tea tsar on Slack.')}),
      el('div', {class: 'actions'}, [
        c ? el('a', {class: 'edit-button primary', href: mail, 'data-report-done': ''}, ['Email ' + (first || 'the tea tsar')]) : null,
        el('a', {class: 'edit-button' + (c ? '' : ' primary'), href: issue, target: '_blank', rel: 'noopener', 'data-report-done': ''}, ['Open a GitHub issue']),
        el('button', {type: 'button', class: 'edit-button', 'data-report-done': ''}, ['Cancel'])
      ])
    ]);
    dlg.addEventListener('click', function(ev){ if (ev.target === dlg || ev.target.closest('[data-report-done]')) dlg.close(); });
    dlg.addEventListener('close', function(){ dlg.remove(); });
    document.body.appendChild(dlg);
    dlg.showModal();
  }

  // A duty: when, what you do (one phrase, e.g. "Tea duty at the research talk"), and what you can do about it.
  // Can't make it (the bot hands it on; too close: Swap), Swap, and Cancel, which is always there but loud and asks first.
  function dutyCard(d, people){
    var msg = el('div', {class: 'msg'});
    var panel = el('div', {class: 'panel hidden'});
    var head = el('div', {class: 'row'}, [
      el('span', {class: 'when', text: d.when}),
      dutyBadge(d.type, d.duty, d.duty_label),
      d.tentative ? el('span', {class: 'chip', text: 'tentative'}) : null,
      d.cancelled && d.duty === 'presenter' ? el('span', {class: 'chip', text: 'talk cancelled'}) : null
    ]);
    var card = el('div', {class: 'card'}, [head]);
    if (d.duty === 'presenter') card.appendChild(el('div', {class: 'title' + (d.title ? '' : ' muted'), text: d.title || 'No title yet'}));
    if (d.pending){
      var withdraw = el('button', {text: 'Withdraw'});
      withdraw.addEventListener('click', function(){ call('api_withdraw_swap', [TOKEN, d.pending.code], function(res){ ok(msg, res); setTimeout(load, 1500); }, msg, withdraw); });
      card.appendChild(el('div', {class: 'row', style: 'margin-top:8px'}, [el('span', {class: 'muted', text: 'Waiting for ' + d.pending.to + ' to accept your old swap request.'}), withdraw]));
    }
    var actions = el('div', {class: 'row', style: 'margin-top:10px'});
    var open_duty = d.live && !(d.cancelled && d.duty === 'presenter');
    if (open_duty) actions.appendChild(el('button', {class: d.can_hand_on ? 'primary' : '', text: 'Can\'t make it', onclick: function(){ cantMakeIt(panel, d, people, msg); }}));
    if (open_duty && !d.tentative) actions.appendChild(el('button', {text: 'Swap', onclick: function(){ showSwap(panel, d, people, msg); }}));
    if (d.can_cancel) actions.appendChild(el('button', {class: 'alert', text: 'Cancel', onclick: function(){ showCancel(d, msg); }}));
    if (d.can_title) actions.appendChild(el('button', {text: d.title ? 'Edit title' : 'Add title', onclick: function(){ showTitle(panel, d, msg); }}));
    if (actions.childNodes.length) card.appendChild(actions);
    if (open_duty) card.appendChild(el('p', {class: 'muted', style: 'margin:8px 0 0;font-size:13px', text: d.can_hand_on
      ? 'Can\'t make it? Until ' + d.hand_on_until + ', the bot hands it to the next person in line, and you keep your turn.'
      : (d.tentative ? 'Tentative: you can swap or add a title once it is confirmed. ' : '') + 'Too close for the bot to hand it on: agree it with a colleague and use Swap.'}));
    card.appendChild(panel);
    card.appendChild(msg);
    return card;
  }

  // A modal question for a duty. opts: title, body (nodes), yes (label), alerting (red), ready(yes button) to
  // enable it, run(done, msgEl, yes button).
  function dutyDialog(opts){
    var old = document.querySelector('.duty-dialog');
    if (old) old.remove();
    var m = el('div', {class: 'msg'});
    var yes = el('button', {class: opts.alerting ? 'alert' : 'primary', text: opts.yes});
    var no = el('button', {text: opts.no || 'Keep it'});
    var dlg = el('dialog', {class: 'duty-dialog' + (opts.alerting ? ' alerting' : ''), 'aria-labelledby': 'duty-dialog-title'},
      [el('h2', {id: 'duty-dialog-title', text: opts.title})].concat(opts.body).concat([el('div', {class: 'actions'}, [yes, no]), m]));
    no.addEventListener('click', function(){ dlg.close(); });
    yes.addEventListener('click', function(){ opts.run(function(){ dlg.close(); }, m, yes); });
    if (opts.ready) opts.ready(yes);
    dlg.addEventListener('close', function(){ dlg.remove(); });
    document.body.appendChild(dlg);
    dlg.showModal();
    no.focus();
  }

  function cantMakeIt(panel, d, people, msg){
    if (!d.can_hand_on){
      showSwap(panel, d, people, msg, 'This is too close for the bot to hand it on. Please agree it with a colleague and hand it over here. If really nobody can, cancel (the red button) as a last resort.');
      return;
    }
    dutyDialog({
      title: 'Can\'t make it?',
      body: [el('p', {}, ['The bot hands your ', el('strong', {text: d.duty_label.toLowerCase()}), ' on ' + d.when + ' to the next person in line, by the usual fair rules (around everyone\'s away dates), and emails you both.']),
             el('p', {class: 'muted', text: 'You keep your turn, so you\'ll be scheduled again sooner. Your email has a link to undo it.'})],
      yes: 'Hand it on', no: 'Keep it',
      run: function(done, m, yes){ call('api_cant_make_it', [TOKEN, d.row_id, d.duty], function(res){ done(); ok(msg, res); setTimeout(load, 2500); }, m, yes); }
    });
  }

  // Taking over a colleague's slot: the list (next weeks, duties you could be scheduled for) loads on request.
  function takeOverCard(){
    var msg = el('div', {class: 'msg'});
    var list = el('div');
    var show = el('button', {text: 'Show slots I could take over'});
    show.addEventListener('click', function(){
      call('api_takeable', [TOKEN], function(items){
        show.remove();
        msg.className = 'msg'; msg.textContent = '';
        if (!items.length){ list.appendChild(el('p', {class: 'muted', text: 'No confirmed slots you could take over in the next weeks.'})); return; }
        items.forEach(function(t){
          var m = el('div', {class: 'msg'});
          var take = el('button', {class: 'primary', text: 'Take over'});
          take.addEventListener('click', function(){
            call('api_take_over', [TOKEN, t.row_id, t.duty, t.from], function(res){ ok(m, res); take.disabled = true; setTimeout(load, 2500); }, m, take);
          });
          list.appendChild(el('div', {style: 'border-top:1px solid var(--line);padding:8px 0'}, [
            el('div', {class: 'row'}, [el('span', {class: 'when', text: t.when}), dutyBadge(t.type, t.duty, t.duty_label)]),
            el('div', {style: 'margin-top:4px'}, [el('strong', {text: t.from_name}), t.title ? ': ' + t.title : '']),
            el('div', {class: 'row', style: 'margin-top:6px'}, [take]), m
          ]));
        });
      }, msg, show);
    });
    return el('div', {class: 'card'}, [
      el('p', {class: 'muted', style: 'margin-top:0', text: 'Step in for a colleague. Please agree it with them first: it goes through straight away, and you both get an email with a link to undo it.'}),
      show, list, msg
    ]);
  }

  function showSwap(panel, d, people, msg, intro){
    panel.innerHTML = '';
    panel.classList.remove('hidden');
    if (intro) panel.appendChild(el('p', {class: 'warn', text: intro}));
    // people who normally do this duty first, then everyone else (a visitor may still step in)
    var usual = d.usual || [];
    var option = function(p){ return el('option', {value: p.id, text: p.name}); };
    var first = people.filter(function(p){ return usual.indexOf(p.id) >= 0; });
    var rest = people.filter(function(p){ return usual.indexOf(p.id) < 0; });
    var sel = el('select', {}, [el('option', {value: '', text: 'Choose who takes it over…'})].concat(first.length && rest.length
      ? [el('optgroup', {label: 'On this rota'}, first.map(option)), el('optgroup', {label: 'Everyone else'}, rest.map(option))]
      : people.map(option)));
    var btn = el('button', {class: 'primary', text: 'Swap'});
    // turns are counted per rota: someone outside it can step in, but the slot then counts for nobody
    var note = el('p', {class: 'muted hidden', style: 'margin:6px 0 0;font-size:13px', text: 'Not on this rota: they can still take it, but it won\'t count as anyone\'s turn. You keep yours, so you\'ll be scheduled again soon.'});
    sel.addEventListener('change', function(){ note.classList.toggle('hidden', !(first.length && sel.value && usual.indexOf(sel.value) < 0)); });
    btn.addEventListener('click', function(){
      if (!sel.value){ msg.className = 'msg err'; msg.textContent = 'Please choose a person.'; return; }
      call('api_swap', [TOKEN, d.row_id, d.duty, sel.value], function(res){ ok(msg, res); setTimeout(load, 1500); }, msg, btn);
    });
    panel.appendChild(el('p', {class: 'muted', text: 'Please agree it with them first: the swap goes through straight away. You both get an email, with a link to undo it in case it was a mistake.'}));
    panel.appendChild(sel);
    panel.appendChild(note);
    panel.appendChild(el('div', {class: 'row', style: 'margin-top:8px'}, [btn, el('button', {text: 'Close', onclick: function(){ panel.classList.add('hidden'); }})]));
  }

  // Cancelling is a last resort: always next to Swap, in red, and it asks first (with a reason and a tick).
  function showCancel(d, msg){
    var talk = d.duty === 'presenter';
    var reason = el('textarea', {placeholder: talk ? 'Why can\'t it go ahead, and why can\'t anyone take over?' : 'Why can\'t you do it, and why not hand it on?'});
    var check = el('input', {type: 'checkbox', style: 'width:auto;margin:0 8px 0 0'});
    var effect = talk
      ? 'The calendar shows the talk as cancelled and the organiser is told. Tea still goes ahead (just tea). You keep your turn.'
      : d.duty_label.indexOf('just tea') >= 0 ? 'The just tea is cancelled and the organiser is told. You keep your turn.'
      : 'Nobody will be on ' + d.duty_label.toLowerCase() + ' then, and the organiser is told. You keep your turn.';
    dutyDialog({
      title: '🚨 Cancel ' + (talk ? 'the talk' : 'your ' + d.duty_label.toLowerCase()) + '?',
      alerting: true,
      body: [el('p', {}, [el('strong', {text: 'A cancellation is a gap for everyone. '}), d.can_hand_on
               ? 'Please use "Can\'t make it" instead: the bot finds someone for you.'
               : 'Please try a swap with a colleague first.']),
             el('p', {class: 'muted', text: d.when + '. ' + effect}),
             el('label', {text: 'Reason (the organiser sees it)'}), reason,
             el('label', {style: 'display:flex;align-items:center;color:var(--text);font-size:14px;margin-top:10px'}, [check, talk ? 'Nobody can take over, so it has to be cancelled.' : 'I really want to cancel it.'])],
      yes: 'Yes, cancel it', no: 'Keep it',
      ready: function(yes){
        yes.disabled = true;
        var update = function(){ yes.disabled = !(check.checked && reason.value.trim().length >= 10); };
        check.addEventListener('change', update);
        reason.addEventListener('input', update);
      },
      run: function(done, m, yes){ call('api_cancel', [TOKEN, d.row_id, reason.value, d.duty], function(res){ done(); ok(msg, res); setTimeout(load, 2500); }, m, yes); }
    });
  }

  function showTitle(panel, d, msg){
    panel.innerHTML = '';
    panel.classList.remove('hidden');
    var t = el('input', {type: 'text', value: d.title || '', placeholder: 'Talk title'});
    var desc = el('textarea', {placeholder: 'Description, paper link, …'});
    desc.value = d.description || '';
    var btn = el('button', {class: 'primary', text: 'Save'});
    btn.addEventListener('click', function(){
      call('api_title', [TOKEN, d.row_id, t.value, desc.value], function(res){ ok(msg, res); setTimeout(load, 1500); }, msg, btn);
    });
    panel.appendChild(el('label', {text: 'Title'}));
    panel.appendChild(t);
    panel.appendChild(el('label', {text: 'Description (for journal clubs, include the paper link)'}));
    panel.appendChild(desc);
    panel.appendChild(el('div', {class: 'row', style: 'margin-top:8px'}, [btn, el('button', {text: 'Close', onclick: function(){ panel.classList.add('hidden'); }})]));
  }

  function awayCard(s){
    var msg = el('div', {class: 'msg'});
    var card = el('div', {class: 'card'});
    if (s.away_hidden){
      card.appendChild(el('p', {class: 'muted', text: s.has_away_sheet ? 'Hidden in the debug view: their away dates are private.' : 'They have no away-dates sheet yet.'}));
      return card;
    }
    if (!s.away.length) card.appendChild(el('p', {class: 'muted', text: 'No upcoming away dates.'}));
    s.away.forEach(function(a){
      var right = el('button', {text: 'Remove'});
      right.addEventListener('click', function(){ call('api_remove_away', [TOKEN, a.row], function(res){ ok(msg, res); setTimeout(load, 800); }, msg, right); });
      card.appendChild(el('div', {class: 'row', style: 'justify-content:space-between;margin-bottom:6px'}, [
        el('span', {}, [el('span', {class: 'when', text: a.label}), a.reason ? el('span', {class: 'muted', text: ' · ' + a.reason}) : null]), right
      ]));
    });
    if (!s.has_away_sheet){
      card.appendChild(el('p', {class: 'muted', text: 'You do not have an away-dates sheet yet. Please ask the tea tsar for one.'}));
      return card;
    }
    var from = el('input', {type: 'date'});
    var to = el('input', {type: 'date'});
    var reason = el('input', {type: 'text', placeholder: 'Optional, e.g. conference'});
    var add = el('button', {class: 'primary', text: 'Add away dates'});
    add.addEventListener('click', function(){ call('api_add_away', [TOKEN, from.value, to.value, reason.value], function(res){ ok(msg, res); setTimeout(load, 800); }, msg, add); });
    card.appendChild(el('div', {class: 'panel'}, [
      el('div', {class: 'grid2'}, [el('div', {}, [el('label', {text: 'From'}), from]), el('div', {}, [el('label', {text: 'To'}), to])]),
      el('label', {text: 'Reason'}), reason,
      el('div', {class: 'row', style: 'margin-top:8px'}, [add])
    ]));
    card.appendChild(el('p', {class: 'muted', style: 'margin:8px 0 0;font-size:13px', text: 'Until three weeks before a slot of yours, adding away dates that cover it is enough: the next morning the bot hands it to the next free person and emails you both. Closer than that, please ask someone to swap.'}));
    card.appendChild(msg);
    return card;
  }

  function organiserCard(o){
    var msg = el('div', {class: 'msg'});
    var talks = o.rota === 'talks';
    var from = el('input', {type: 'date', value: o.from});
    var to = el('input', {type: 'date', value: o.to});
    var tfrom = el('input', {type: 'date', value: o.tea_from});
    var tto = el('input', {type: 'date', value: o.tea_to});
    var showResult = function(res){
      msg.className = 'msg ok'; msg.innerHTML = '';
      var head = (res.created !== undefined ? 'Created ' + res.created + ' slot' + (res.created === 1 ? '' : 's') + (res.existing ? ' (' + res.existing + ' already existed)' : '') + '. ' : '') +
        'Filled ' + res.filled.length + '. Check them on the Gatsby Rotas site: delete any you do not need (closures, retreat, deadlines) and change anyone you like, then finalise.';
      msg.appendChild(el('div', {text: head}));
      if (res.holidays && res.holidays.length) msg.appendChild(el('div', {class: 'muted', text: 'Skipped (bank holidays, closures): ' + res.holidays.join(', ')}));
      var list = el('ul', {style: 'margin:6px 0 0;padding-left:18px'});
      res.filled.concat(res.unfilled).forEach(function(l){ list.appendChild(el('li', {text: l})); });
      msg.appendChild(list);
      res.warnings.forEach(function(w){ msg.appendChild(el('div', {class: 'muted', text: w})); });
    };
    var plan = el('button', {class: 'primary', text: 'Plan these dates'});
    plan.addEventListener('click', function(){
      var ranges = talks ? {research_from: from.value, research_to: to.value, tea_from: tfrom.value, tea_to: tto.value} : {from: from.value, to: to.value};
      call('api_plan_slots', [TOKEN, o.rota, ranges], function(res){ showResult(res); setTimeout(function(){ call('api_state', [TOKEN], function(){}); }, 0); }, msg, plan);
      msg.textContent = 'Creating the slots, reading everyone\'s away dates and filling them. This can take a minute or two…';
    });
    var fill = el('button', {text: 'Fill ' + o.empty + ' empty slot' + (o.empty === 1 ? '' : 's') + ' again'});
    if (!o.empty) fill.classList.add('hidden');
    fill.addEventListener('click', function(){
      call('api_fill_slots', [TOKEN, o.rota], showResult, msg, fill);
      msg.textContent = 'Reading everyone\'s away dates and filling the slots. This can take a minute or two…';
    });
    var box = el('input', {type: 'checkbox', style: 'width:auto'});
    var fin = el('button', {text: 'Finalise ' + o.tentative + ' tentative slot' + (o.tentative === 1 ? '' : 's')});
    if (!o.tentative) fin.disabled = true;
    fin.addEventListener('click', function(){
      call('api_finalise', [TOKEN, o.rota, box.checked], function(res){ ok(msg, res); setTimeout(load, 1500); }, msg, fin);
    });
    var dates = talks
      ? [el('div', {class: 'grid2'}, [el('div', {}, [el('label', {text: 'Research talks from'}), from]), el('div', {}, [el('label', {text: 'to'}), to])]),
         el('div', {class: 'grid2'}, [el('div', {}, [el('label', {text: 'Tea talks from'}), tfrom]), el('div', {}, [el('label', {text: 'to'}), tto])])]
      : [el('div', {class: 'grid2'}, [el('div', {}, [el('label', {text: 'From'}), from]), el('div', {}, [el('label', {text: 'To'}), to])])];
    return el('div', {class: 'card'}, [
      el('div', {class: 'when', text: o.label}),
      o.auto ? el('p', {style: 'margin:4px 0 0', text: 'Autopilot is on: every Monday the bot plans and fills the slots up to ' + o.auto + ' weeks ahead and emails you the list. Three days later they go on the calendar and everyone on duty is told; until then, change or remove slots on the Gatsby Rotas site. You can still plan by hand below.'}) : null,
      el('p', {class: 'muted', style: 'margin:4px 0 0', text: 'Plan creates the slots for these dates (bank holidays and closures are skipped) and fills them fairly, respecting away dates. They stay tentative: check them on the Gatsby Rotas site, then finalise to put them on the calendar.'})
    ].concat(dates).concat([
      el('div', {class: 'row', style: 'margin-top:10px'}, [plan, fill]),
      el('label', {style: 'display:flex;gap:8px;align-items:center;color:inherit;font-size:14px;margin-top:12px'}, [box, 'When finalising, email the group that the schedule was updated']),
      el('div', {class: 'row', style: 'margin-top:8px'}, [fin]),
      msg
    ]));
  }

  function emailCard(s){
    if (DEBUG) return el('div', {class: 'card'}, [el('p', {}, ['Reminders and swap emails go to ', el('strong', {text: s.email || 'nobody (no address registered)'}), ' (half hidden in the debug view).'])]);
    var msg = el('div', {class: 'msg'});
    var input = el('input', {type: 'email', placeholder: 'new address'});
    var btn = el('button', {text: 'Change'});
    btn.addEventListener('click', function(){ call('api_change_email', [TOKEN, input.value], function(res){ ok(msg, res); }, msg, btn); });
    return el('div', {class: 'card'}, [
      el('p', {}, ['Reminders and swap emails go to ', el('strong', {text: s.email}), '.']),
      el('div', {class: 'row'}, [el('div', {style: 'flex:1;min-width:200px'}, [input]), btn]),
      msg
    ]);
  }

  // ---- no personal code and no unit key (the bare public address): your link by email ----
  function renderNoKey(){
    var msg = el('div', {class: 'msg'});
    var input = el('input', {type: 'email', placeholder: 'the address your tea reminders come to', autocomplete: 'email'});
    var btn = el('button', {class: 'primary', text: 'Send me my link'});
    var send = function(){ call('api_request_link_by_email', [input.value], function(res){ ok(msg, res); }, msg, btn); };
    btn.addEventListener('click', send);
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
    app.innerHTML = '';
    app.appendChild(el('h1', {text: 'Gatsby tea'}));
    app.appendChild(el('p', {class: 'muted', text: 'Swap your slot, add your talk title and set your away dates on your personal tea page. Enter the email address the tea bot writes to you at (where your reminders arrive; not necessarily your UCL one), and we will send you its link.' +
      (LEAVE ? ' Leaving the tea system is at the bottom of that page.' : '')}));
    app.appendChild(el('div', {class: 'card'}, [el('label', {text: 'Your email'}), input, el('div', {class: 'row', style: 'margin-top:10px'}, [btn]), msg,
      el('p', {class: 'muted', style: 'margin:10px 0 0;font-size:13px', text: 'The link is also in every gatsby.tea calendar event and in the tea bot\'s emails.'}),
      LEAVE ? null : el('p', {class: 'muted', style: 'margin:6px 0 0;font-size:13px'}, [el('button', {class: 'quiet', text: 'Pick your name instead', onclick: renderLanding})])]));
  }

  // the tab icon is a setting (FAVICON_URL in the constants sheet); without it the tab has none
  fetch(EXEC_URL, {method: 'POST', body: JSON.stringify({fn: 'api_page_icon', args: []}), credentials: 'omit'})
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res.ok || !res.result) return;
      document.getElementById('icon').href = res.result;
    })
    .catch(function(){});

  function route(){
    var view = AS ? 'debug' : UNDO ? 'undo' : SWAP ? 'swap' : CONFIRM ? 'confirm' : LEAVE ? 'leave' : (TOKEN || (!LEAVE && remembered())) ? 'personal' : KEY ? 'landing' : 'no-key';
    if (window.GatsbyTelemetry){ window.GatsbyTelemetry.signedIn(TOKEN || remembered() ? 'member' : 'no'); window.GatsbyTelemetry.view(view); }
    if (AS) renderDebug();
    else if (UNDO) renderUndo();
    else if (SWAP) renderSwapAnswer();
    else if (CONFIRM) renderConfirm();
    else if (LEAVE && TOKEN) renderLeave();
    else if (LEAVE && KEY) renderLeaveLanding();
    else if (TOKEN) load();
    else if (!LEAVE && remembered()){ TOKEN = remembered(); FROM_MEMORY = true; load(); }
    else if (KEY || !LEAVE) renderLanding();
    else renderNoKey();
  }
  route();
</script>
</body>
</html>
