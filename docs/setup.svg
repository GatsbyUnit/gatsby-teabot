<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">How the Gatsby tea bot fits together</title>
  <desc id="desc">Unit members and organisers use the tea page. The tea page uses Gatsby Tea Automation as a library. The automation syncs with Notion every hour, keeps the gatsby.tea calendar in step and reads and writes Google Sheets. The Cron Jobs read Notion and send reminders. Hand edits to the calendar are copied back to Notion. GitHub deploys all Apps Script projects.</desc>
  <style>
    .bg { fill: #ffffff; }
    .group { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .pill { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1.2; }
    .t { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .s { font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .l { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .g { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; letter-spacing: 0.06em; }
    .code { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .edge { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: #8c959f; }
    .on-bg { fill: #ffffff; }
    .on-group { fill: #f6f8fa; }
    .blue { fill: #0969da; } .green { fill: #1a7f37; } .purple { fill: #8250df; }
    .amber { fill: #bf8700; } .ink { fill: #1f2328; } .gray { fill: #6e7781; }
    @media (prefers-color-scheme: dark) {
      .bg, .on-bg { fill: #0d1117; }
      .group, .on-group { fill: #161b22; }
      .group { stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .pill { fill: #2b2111; stroke: #9e6a03; }
      .t { fill: #f0f6fc; }
      .s, .l, .g, .code { fill: #9198a1; }
      .edge { stroke: #6e7681; } .head { fill: #6e7681; }
      .blue { fill: #4493f8; } .green { fill: #3fb950; } .purple { fill: #ab7df8; }
      .amber { fill: #d29922; } .ink { fill: #f0f6fc; } .gray { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="560" rx="14"/>

  <!-- people and GitHub -->
  <rect class="pill" x="90" y="36" width="310" height="60" rx="30"/>
  <text class="t" x="245" y="71" text-anchor="middle">Unit members &amp; organisers</text>

  <rect class="card" x="640" y="36" width="220" height="60" rx="12"/>
  <rect class="gray" x="656" y="50" width="24" height="4" rx="2"/>
  <text class="t" x="750" y="64" text-anchor="middle">GitHub</text>
  <text class="s" x="750" y="84" text-anchor="middle">code · tests · docs</text>

  <!-- Apps Script projects -->
  <rect class="group" x="60" y="150" width="830" height="175" rx="16"/>
  <text class="g" x="870" y="174" text-anchor="end">APPS SCRIPT · RUNS AS GATSBY.TEABOT</text>

  <rect class="card" x="90" y="190" width="220" height="100" rx="12"/>
  <rect class="blue" x="106" y="204" width="24" height="4" rx="2"/>
  <text class="t" x="200" y="232" text-anchor="middle">Gatsby Tea Page</text>
  <text class="s" x="200" y="256" text-anchor="middle">everyone's personal page</text>
  <text class="s" x="200" y="274" text-anchor="middle">(web app)</text>

  <rect class="card" x="365" y="190" width="220" height="100" rx="12"/>
  <rect class="blue" x="381" y="204" width="24" height="4" rx="2"/>
  <text class="t" x="475" y="232" text-anchor="middle">Gatsby Tea Automation</text>
  <text class="s" x="475" y="256" text-anchor="middle">hourly sync · scheduling</text>
  <text class="s" x="475" y="274" text-anchor="middle">emails</text>

  <rect class="card" x="640" y="190" width="220" height="100" rx="12"/>
  <rect class="blue" x="656" y="204" width="24" height="4" rx="2"/>
  <text class="t" x="750" y="232" text-anchor="middle">Gatsby Tea Cron Jobs</text>
  <text class="s" x="750" y="256" text-anchor="middle">talk &amp; coffee reminders</text>
  <text class="s" x="750" y="274" text-anchor="middle">people sync</text>

  <!-- data -->
  <rect class="card" x="90" y="430" width="220" height="100" rx="12"/>
  <rect class="purple" x="106" y="444" width="24" height="4" rx="2"/>
  <text class="t" x="200" y="472" text-anchor="middle">gatsby.tea calendar</text>
  <text class="s" x="200" y="496" text-anchor="middle">a copy of Notion,</text>
  <text class="s" x="200" y="514" text-anchor="middle">kept in step by the bot</text>

  <rect class="card" x="365" y="430" width="220" height="100" rx="12"/>
  <rect class="green" x="381" y="444" width="24" height="4" rx="2"/>
  <text class="t" x="475" y="472" text-anchor="middle">Google Sheets</text>
  <text class="s" x="475" y="496" text-anchor="middle">settings · emails</text>
  <text class="s" x="475" y="514" text-anchor="middle">away dates</text>

  <rect class="card" x="640" y="430" width="220" height="100" rx="12"/>
  <rect class="ink" x="656" y="444" width="24" height="4" rx="2"/>
  <text class="t" x="750" y="472" text-anchor="middle">Notion</text>
  <text class="s" x="750" y="496" text-anchor="middle">Schedule · People</text>
  <text class="s" x="750" y="514" text-anchor="middle">the source of truth</text>

  <!-- edges -->
  <path class="edge" d="M200,96 V188" marker-end="url(#arrow)"/>
  <text class="l" x="212" y="128">swaps · titles · away dates · Zoom · scheduling</text>

  <path class="edge" d="M750,96 V148" marker-end="url(#arrow)"/>
  <text class="code" x="762" y="127">deploy.py</text>

  <path class="edge" d="M310,240 H363" marker-end="url(#arrow)"/>
  <rect class="on-group" x="313" y="221" width="48" height="14"/>
  <text class="l" x="337" y="232" text-anchor="middle">library</text>

  <path class="edge" d="M430,292 V375 H255 V428" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect class="on-bg" x="314" y="368" width="52" height="15"/>
  <text class="l" x="340" y="379" text-anchor="middle">events</text>

  <path class="edge" d="M475,292 V428" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <path class="edge" d="M520,292 V375 H700 V428" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect class="on-bg" x="576" y="368" width="70" height="15"/>
  <text class="l" x="611" y="379" text-anchor="middle">every hour</text>

  <path class="edge" d="M800,292 V428" marker-end="url(#arrow)"/>
  <text class="l" x="810" y="382">reads</text>

  <path class="edge dash" d="M90,66 H32 V480 H88" marker-end="url(#arrow)"/>
  <g transform="translate(32,300) rotate(-90)">
    <rect class="on-bg" x="-34" y="-9" width="68" height="17"/>
    <text class="l" x="0" y="4" text-anchor="middle">hand edits</text>
  </g>
</svg>
